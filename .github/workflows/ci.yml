name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: restaurant_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restaurant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/restaurant_test
      POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/restaurant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit
      - name: Lint backend
        working-directory: backend
        run: ruff check .
      - name: Check backend formatting
        working-directory: backend
        run: ruff format --check .
      - name: Typecheck backend
        working-directory: backend
        run: python -m mypy app tests
      - name: Validate PostgreSQL migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Test backend (PostgreSQL)
        working-directory: backend
        run: pytest
      - name: Audit backend dependencies
        working-directory: backend
        run: python -m pip_audit . --skip-editable

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/${{ matrix.total_shards }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total_shards: [4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: restaurant_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restaurant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The real end-to-end flow boots the FastAPI app against this PostgreSQL service.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/restaurant_test
      APP_ENV: e2e
      JWT_ACCESS_SECRET: e2e-access-secret
      JWT_REFRESH_SECRET: e2e-refresh-secret
      REFRESH_COOKIE_SECURE: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
      CORS_ALLOW_ORIGIN_REGEX: 'http://localhost:3000'
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-shard-${{ matrix.shard }}-of-${{ matrix.total_shards }}
        run: npm exec -- playwright test --shard=${{ matrix.shard }}/${{ matrix.total_shards }}
      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}-of-${{ matrix.total_shards }}
          path: frontend/playwright-report-shard-${{ matrix.shard }}-of-${{ matrix.total_shards }}
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}-of-${{ matrix.total_shards }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: ${{ always() }}
    steps:
      - name: Verify E2E shards passed
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "One or more Playwright E2E shards failed or did not complete."
            exit 1
          fi
          echo "All Playwright E2E shards passed."
