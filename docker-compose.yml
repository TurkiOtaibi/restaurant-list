services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant_wishlist_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_wishlist}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurant_user} -d ${POSTGRES_DB:-restaurant_wishlist}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
