<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090e16" />
    <title>سجل | غير متصل</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090e16;
        --surface: #101822;
        --border: #283544;
        --text: #f4f7fa;
        --muted: #8e9baa;
        --accent: #29cb83;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100svh;
        padding: max(24px, env(safe-area-inset-top)) 20px
          max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 18% 0%, rgba(41, 203, 131, 0.14), transparent 22rem),
          linear-gradient(180deg, #0a1019 0%, var(--bg) 48%);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(100%, 420px);
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(16, 24, 34, 0.92);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(26px, 8vw, 36px);
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 20px;
        padding: 0 18px;
        border: 1px solid rgba(41, 203, 131, 0.36);
        border-radius: 999px;
        background: rgba(24, 49, 38, 0.86);
        color: var(--text);
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>أنت غير متصل</h1>
      <p>تعذر تحميل الصفحة الآن. تحقق من الاتصال ثم جرّب فتح سجل مرة أخرى.</p>
      <a href="/">العودة إلى سجل</a>
    </main>
  </body>
</html>
