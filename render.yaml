services:
  - type: web
    name: restaurant-list-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: python -m pip install --upgrade pip && pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_NAME
        value: Restaurant Wishlist API
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: REFRESH_COOKIE_NAME
        value: restaurant_refresh_token
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      - key: AUTH_RATE_LIMIT_REQUESTS
        value: "10"
      - key: AUTH_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: restaurant-rate-limit
          property: connectionString

  - type: web
    name: restaurant-list-web
    runtime: node
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

  - type: redis
    name: restaurant-rate-limit
    plan: free
    region: singapore
    # No eviction so rate-limit counters are not dropped under memory pressure.
    # NOTE: guaranteed persistence across restarts/deployments requires a paid
    # plan; the free plan is shared across instances but may not persist on
    # restart. Upgrade the plan before public beta to fully meet the requirement.
    maxmemoryPolicy: noeviction
    ipAllowList: []
